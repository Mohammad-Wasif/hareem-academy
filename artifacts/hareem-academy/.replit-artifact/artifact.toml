kind = "web"
previewPath = "/"
title = "Hareem Academy"
version = "1.0.0"
id = "artifacts/hareem-academy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19925

[services.development]
run = "pnpm --filter @workspace/hareem-academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hareem-academy", "run", "build" ]
publicDir = "artifacts/hareem-academy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19925"
BASE_PATH = "/"
